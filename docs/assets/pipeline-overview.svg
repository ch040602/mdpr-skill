<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MDPR Design Components Pipeline</title>
  <desc id="desc">A polished overview image showing that the LLM provides optional semantic hints while deterministic rule-based components make final design decisions and render editable outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#EEF7F1"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#16A34A"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Inter, Segoe UI, Arial, sans-serif; letter-spacing: .8px; text-transform: uppercase; }
      .card-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .card-body { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #526071; }
      .small { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748B; }
      .badge { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
      .num { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .flow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .hint { stroke: #2563EB; stroke-width: 2.2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowBlue); }
      .rule-arrow { stroke: #16A34A; stroke-width: 2.2; fill: none; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>

  <text x="64" y="66" class="title">MDPR Design Components Pipeline</text>
  <text x="64" y="96" class="subtitle">The LLM supplies semantic hints only. Deterministic rules own layout, styling, coherence, and editable rendering.</text>

  <rect x="64" y="128" width="1272" height="568" rx="26" fill="#FFFFFF" stroke="#DDE6F3" filter="url(#shadow)"/>

  <text x="92" y="166" class="section" fill="#64748B">Input and structure</text>
  <text x="512" y="166" class="section" fill="#16A34A">Rule-based deterministic boundary</text>
  <text x="1128" y="166" class="section" fill="#64748B">Outputs</text>

  <rect x="88" y="196" width="176" height="104" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="110" cy="218" r="11" fill="#E2E8F0"/>
  <text x="106" y="222" class="num">1</text>
  <text x="124" y="222" class="card-title">Markdown</text>
  <text x="110" y="250" class="card-body">User content</text>
  <text x="110" y="270" class="card-body">headings, lists,</text>
  <text x="110" y="290" class="card-body">tables, code, images</text>

  <rect x="308" y="196" width="190" height="104" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="330" cy="218" r="11" fill="#E2E8F0"/>
  <text x="326" y="222" class="num">2</text>
  <text x="344" y="222" class="card-title">MDPR Splitter</text>
  <text x="330" y="250" class="card-body">Slides, elements,</text>
  <text x="330" y="270" class="card-body">semantic structure</text>
  <text x="330" y="290" class="card-body">without visual choices</text>

  <rect x="542" y="196" width="190" height="104" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="564" cy="218" r="11" fill="#E2E8F0"/>
  <text x="560" y="222" class="num">3</text>
  <text x="578" y="222" class="card-title">Slide Element IR</text>
  <text x="564" y="250" class="card-body">Content-only contract</text>
  <text x="564" y="270" class="card-body">for downstream rules</text>

  <path d="M264 248 H308" class="flow"/>
  <path d="M498 248 H542" class="flow"/>

  <rect x="300" y="356" width="292" height="122" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="326" y="388" class="card-title">LLM Assistant</text>
  <text x="326" y="416" class="card-body">May propose intent, grouping,</text>
  <text x="326" y="436" class="card-body">and importance candidates.</text>
  <text x="326" y="462" class="small">No coordinates, colors, variants, or z-order.</text>
  <rect x="472" y="372" width="92" height="26" rx="13" fill="#2563EB"/>
  <text x="493" y="390" class="badge">hints only</text>

  <path d="M637 300 C637 334 548 334 514 356" class="hint"/>
  <path d="M592 416 C634 416 676 348 740 348" class="hint"/>

  <rect x="742" y="190" width="342" height="308" rx="26" fill="url(#rule)" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="772" y="222" class="section" fill="#15803D">Final design decisions happen here</text>

  <rect x="772" y="246" width="128" height="78" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="790" y="276" class="card-title">Features</text>
  <text x="790" y="300" class="card-body">density, mix,</text>
  <text x="790" y="318" class="card-body">size risk</text>

  <rect x="926" y="246" width="128" height="78" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="944" y="276" class="card-title">Rules</text>
  <text x="944" y="300" class="card-body">profile, recipe,</text>
  <text x="944" y="318" class="card-body">variant selection</text>

  <rect x="772" y="358" width="128" height="78" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="790" y="388" class="card-title">Compose</text>
  <text x="790" y="412" class="card-body">regions, boxes,</text>
  <text x="790" y="430" class="card-body">fit, overflow</text>

  <rect x="926" y="358" width="128" height="78" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="944" y="388" class="card-title">Decorate</text>
  <text x="944" y="412" class="card-body">type, radius,</text>
  <text x="944" y="430" class="card-body">shadow, effects</text>

  <path d="M900 285 H926" class="rule-arrow"/>
  <path d="M990 324 V358" class="rule-arrow"/>
  <path d="M926 397 H900" class="rule-arrow"/>
  <path d="M836 358 V324" class="rule-arrow"/>

  <rect x="804" y="456" width="220" height="28" rx="14" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="836" y="475" class="small" fill="#166534">Coherence lint: one visual language</text>

  <path d="M732 248 H772" class="flow"/>

  <rect x="1126" y="220" width="164" height="98" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1150" y="252" class="card-title">Styled Deck IR</text>
  <text x="1150" y="280" class="card-body">Renderer-neutral</text>
  <text x="1150" y="300" class="card-body">visual contract</text>

  <rect x="1126" y="374" width="164" height="118" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1150" y="406" class="card-title">Renderers</text>
  <text x="1150" y="434" class="card-body">Editable PPTX</text>
  <text x="1150" y="454" class="card-body">HTML and PDF</text>
  <text x="1150" y="474" class="card-body">visual validation</text>

  <path d="M1084 344 C1110 344 1110 269 1126 269" class="flow"/>
  <path d="M1208 318 V374" class="flow"/>

  <rect x="92" y="560" width="1190" height="84" rx="20" fill="#F8FAFC" stroke="#D7E1EE"/>
  <text x="124" y="594" class="card-title">Responsibility split</text>
  <text x="124" y="622" class="card-body">LLM: semantic hinting only. Rules: deterministic selection, composition, decoration, coherence, and readability. Renderers: editable objects, z-order, and output verification.</text>
  <rect x="1090" y="580" width="154" height="34" rx="17" fill="#111827"/>
  <text x="1114" y="602" class="badge">font size &gt;= 8pt</text>
</svg>
