name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches package version
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = `v${pkg.version}`;
          const actual = process.env.RELEASE_TAG;
          if (actual !== expected) {
            console.error(`Release tag ${actual} does not match package version ${expected}.`);
            process.exit(1);
          }
          console.log(`Release tag ${actual} matches package version ${pkg.version}.`);
          NODE

      - name: Run release preflight
        run: npm run release:preflight

      - name: Publish to npm
        if: ${{ github.event_name == 'release' }}
        run: npm publish --provenance --access public
